
name: Build Pix-Senso APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compiler Pix-Senso
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: |
          sdkmanager --verbose "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compiler l'APK
        run: gradle --no-daemon assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Pix-Senso-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
