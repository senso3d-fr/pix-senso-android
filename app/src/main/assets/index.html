<!doctype html>
<html lang="fr">
<head>
  <!-- SENSO3D : adaptation de l'interface smartphone uniquement -->
<style id="senso3d-mobile-interface">
@media screen and (max-width: 600px) {
  html, body {
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }

  body { font-size: 16px; }
  *, *::before, *::after { box-sizing: border-box; }

  .app {
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 10px;
  }

  .top {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
    padding: 16px;
    border-radius: 14px;
  }

  .top h1 {
    font-size: clamp(20px, 6vw, 26px);
    line-height: 1.25;
  }

  .top p { font-size: 14px; line-height: 1.45; }

  .logo {
    width: 82px;
    max-width: 100%;
    height: auto;
    max-height: 60px;
    object-fit: contain;
  }

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) !important;
    gap: 12px;
    width: 100%;
    margin-top: 12px;
  }

  .card, .controls, .preview {
    min-width: 0;
    width: 100%;
    max-width: 100%;
  }

  .card { padding: 14px; border-radius: 14px; }

  h2 { font-size: 17px; line-height: 1.35; }

  label {
    font-size: 14px;
    line-height: 1.4;
    margin-top: 14px;
  }

  input:not([type="checkbox"]):not([type="radio"]),
  select, textarea {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 46px;
    padding: 11px 12px;
    font-size: 16px;
    border-radius: 10px;
  }

  input[type="checkbox"], input[type="radio"] {
    width: 22px;
    height: 22px;
    min-width: 22px;
    min-height: 22px;
  }

  button, .btn {
    min-height: 46px;
    max-width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    line-height: 1.35;
    white-space: normal;
    overflow-wrap: anywhere;
    touch-action: manipulation;
  }

  .tools { display: flex; flex-wrap: wrap; gap: 8px; }

  .tools > button, .tools > .btn {
    flex: 1 1 135px;
    min-width: 0;
  }

  .palette {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .color {
    min-width: 0;
    min-height: 66px;
    padding: 9px 4px;
    font-size: 12px;
  }

  .swatch { width: 30px; height: 30px; }

  .stockrow {
    grid-template-columns: 18px minmax(0, 1fr) 45px;
    gap: 8px;
  }

  .bar { min-width: 0; }

  .preview {
    display: flex;
    align-items: center;
  }

  .sheet, .solution-sheet {
    width: 100%;
    max-width: 100%;
    height: auto;
    min-width: 0;
    padding: clamp(10px, 3vw, 18px);
    border-radius: 10px;
    overflow: hidden;
  }

  .sheetHead {
    min-height: 58px;
    height: auto;
    padding: 10px;
    gap: 8px;
  }

  .sheetHead strong { font-size: clamp(14px, 4vw, 20px); }

  .sheetLogo {
    width: 54px;
    height: auto;
    max-height: 40px;
  }

  .sheetTitle { margin: 14px 0 10px; }

  .sheetTitle h3 {
    font-size: clamp(16px, 4.5vw, 21px);
    line-height: 1.25;
  }

  .model { min-width: 0; padding: 10px; }

  .modelLabel {
    font-size: 11px;
    line-height: 1.4;
    margin-bottom: 10px;
  }

  .grid:not(.model-grid-real) {
    width: 100%;
    max-width: 360px;
    gap: 4px;
  }

  .grid:not(.model-grid-real) .cell { min-width: 0; }

  .legend { font-size: 10px; gap: 7px; }

  .objective {
    font-size: 11px;
    line-height: 1.45;
    padding: 10px;
  }

  .footer { flex-wrap: wrap; gap: 6px; font-size: 9px; }

  .notice { font-size: 12px; line-height: 1.45; }

  .solution-layout {
    display: grid;
    grid-template-columns: minmax(0, 1fr) !important;
    gap: 12px;
  }

  .solution-grid, .object-key-grid, .shape-key-grid {
    max-width: 100%;
  }

  .solution-count-row { flex-wrap: wrap; gap: 8px; }

  .gcode-dropdown, .gcode-dropdown-options { max-width: 100%; }

  .gcode-choice, .gcode-token { overflow-wrap: anywhere; }

  table {
    display: block;
    width: 100%;
    max-width: 100%;
    overflow-x: auto;
  }

  img, canvas, svg { max-width: 100%; }
}

@media screen and (max-width: 380px) {
  .app { padding: 7px; }
  .card { padding: 11px; }
  .palette { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tools > button, .tools > .btn { flex-basis: 100%; }
  .sheetHead { align-items: flex-start; }
}
</style>
